version: "3.8"

networks:
  magazyn360-net:
    driver: bridge

volumes:
  pgdata:
    name: magazyn360-pgdata

services:
  magazyn360:
    image: magazyn360:15.06.2025
    container_name: magazyn360
    restart: always
    networks:
      - magazyn360-net
    volumes:
       - ./magazyn360-api:/var/www/magazyn360/app/magazyn360-api
    env_file:
      - ./magazyn360-api/.env
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
    - magazyn360-postgres
    - kafka-broker


  magazyn360-postgres:
    image: postgres:latest
    container_name: magazyn360-postgres
    restart: always
    networks:
      - magazyn360-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - ./magazyn360-api/.env
    ports:
      - "5432:5432"

  kafka-broker:
    image: bitnami/kafka:latest
    container_name: kafka-broker
    networks:
      magazyn360-net: {}
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-broker:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true

  ws-gateway:
    build:
      context: ./magazyn360-services/ws-gateway
    container_name: ws-gateway
    depends_on:
      - magazyn360-postgres
      - kafka-broker
    env_file:
      - ./magazyn360-services/.env
    networks:
      - magazyn360-net
    ports:
      - "8081:8080"
